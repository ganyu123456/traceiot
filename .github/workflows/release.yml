name: Release — 多架构镜像构建与发布

on:
  push:
    branches: [main, develop]   # 每次推送代码自动构建 latest 镜像
    tags:
      - 'v*.*.*'                 # 打 tag 时同时推送版本号 tag
  workflow_dispatch:             # 支持手动触发

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/traceiot-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/traceiot-frontend

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: 构建后端多架构镜像（matrix: amd64 / arm64）
  # ──────────────────────────────────────────────────────────
  build-backend:
    name: 后端镜像 (${{ matrix.arch }})
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm   # GitHub 原生 ARM64 runner，无需 QEMU
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 确定版本标签
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 登录 Harbor（国内仓库，加速服务器拉取）
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: NuGet 缓存（加速 .NET 构建）
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.arch }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: nuget-${{ matrix.arch }}-

      - name: 构建并推送后端镜像（${{ matrix.arch }}）
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}-${{ matrix.arch }}
            ${{ secrets.HARBOR_HOST }}/${{ secrets.HARBOR_PROJECT }}/traceiot-backend:${{ steps.version.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to:   type=gha,scope=backend-${{ matrix.arch }},mode=max
          labels: |
            org.opencontainers.image.title=TraceIoT Backend
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ──────────────────────────────────────────────────────────
  # Job 2: 构建前端多架构镜像（matrix: amd64 / arm64）
  # ──────────────────────────────────────────────────────────
  build-frontend:
    name: 前端镜像 (${{ matrix.arch }})
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm   # GitHub 原生 ARM64 runner，无需 QEMU
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 确定版本标签
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 登录 Harbor（国内仓库，加速服务器拉取）
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Node.js 依赖缓存
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-${{ hashFiles('frontend/package-lock.json') }}

      - name: 构建并推送前端镜像（${{ matrix.arch }}）
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          dockerfile: frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.tag }}-${{ matrix.arch }}
            ${{ secrets.HARBOR_HOST }}/${{ secrets.HARBOR_PROJECT }}/traceiot-frontend:${{ steps.version.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to:   type=gha,scope=frontend-${{ matrix.arch }},mode=max
          labels: |
            org.opencontainers.image.title=TraceIoT Frontend
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ──────────────────────────────────────────────────────────
  # Job 3: 合并多架构 Manifest（amd64 + arm64 → :latest）
  # ──────────────────────────────────────────────────────────
  merge-manifests:
    name: 合并多架构 Manifest
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    permissions:
      contents: read
      packages: write

    steps:
      - name: 确定版本标签
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 登录 Harbor（国内仓库）
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: 合并后端多架构 Manifest
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HARBOR_BACKEND="${{ secrets.HARBOR_HOST }}/${{ secrets.HARBOR_PROJECT }}/traceiot-backend"
          if [ "$TAG" = "latest" ]; then
            docker buildx imagetools create \
              --tag ${{ env.BACKEND_IMAGE }}:latest \
              ${{ env.BACKEND_IMAGE }}:latest-amd64 \
              ${{ env.BACKEND_IMAGE }}:latest-arm64
            docker buildx imagetools create \
              --tag ${HARBOR_BACKEND}:latest \
              ${HARBOR_BACKEND}:latest-amd64 \
              ${HARBOR_BACKEND}:latest-arm64
          else
            docker buildx imagetools create \
              --tag ${{ env.BACKEND_IMAGE }}:${TAG} \
              --tag ${{ env.BACKEND_IMAGE }}:latest \
              ${{ env.BACKEND_IMAGE }}:${TAG}-amd64 \
              ${{ env.BACKEND_IMAGE }}:${TAG}-arm64
            docker buildx imagetools create \
              --tag ${HARBOR_BACKEND}:${TAG} \
              --tag ${HARBOR_BACKEND}:latest \
              ${HARBOR_BACKEND}:${TAG}-amd64 \
              ${HARBOR_BACKEND}:${TAG}-arm64
          fi

      - name: 合并前端多架构 Manifest
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HARBOR_FRONTEND="${{ secrets.HARBOR_HOST }}/${{ secrets.HARBOR_PROJECT }}/traceiot-frontend"
          if [ "$TAG" = "latest" ]; then
            docker buildx imagetools create \
              --tag ${{ env.FRONTEND_IMAGE }}:latest \
              ${{ env.FRONTEND_IMAGE }}:latest-amd64 \
              ${{ env.FRONTEND_IMAGE }}:latest-arm64
            docker buildx imagetools create \
              --tag ${HARBOR_FRONTEND}:latest \
              ${HARBOR_FRONTEND}:latest-amd64 \
              ${HARBOR_FRONTEND}:latest-arm64
          else
            docker buildx imagetools create \
              --tag ${{ env.FRONTEND_IMAGE }}:${TAG} \
              --tag ${{ env.FRONTEND_IMAGE }}:latest \
              ${{ env.FRONTEND_IMAGE }}:${TAG}-amd64 \
              ${{ env.FRONTEND_IMAGE }}:${TAG}-arm64
            docker buildx imagetools create \
              --tag ${HARBOR_FRONTEND}:${TAG} \
              --tag ${HARBOR_FRONTEND}:latest \
              ${HARBOR_FRONTEND}:${TAG}-amd64 \
              ${HARBOR_FRONTEND}:${TAG}-arm64
          fi
