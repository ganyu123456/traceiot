name: Release — 多架构镜像构建与发布

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: 构建后端多架构镜像
  # ──────────────────────────────────────────────────────────
  build-backend:
    name: 后端镜像 (${{ matrix.arch }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 确定版本标签
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: NuGet 缓存
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.arch }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: nuget-${{ matrix.arch }}-

      - name: 构建并推送后端镜像（${{ matrix.arch }}）
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ secrets.HARBOR_HOST }}/${{ secrets.HARBOR_PROJECT }}/traceiot-backend:${{ steps.version.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to:   type=gha,scope=backend-${{ matrix.arch }},mode=max
          labels: |
            org.opencontainers.image.title=TraceIoT Backend
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ──────────────────────────────────────────────────────────
  # Job 2: 构建前端多架构镜像
  # ──────────────────────────────────────────────────────────
  build-frontend:
    name: 前端镜像 (${{ matrix.arch }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 确定版本标签
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Node.js 依赖缓存
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-${{ hashFiles('frontend/package-lock.json') }}

      - name: 构建并推送前端镜像（${{ matrix.arch }}）
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          dockerfile: frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ secrets.HARBOR_HOST }}/${{ secrets.HARBOR_PROJECT }}/traceiot-frontend:${{ steps.version.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to:   type=gha,scope=frontend-${{ matrix.arch }},mode=max
          labels: |
            org.opencontainers.image.title=TraceIoT Frontend
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ──────────────────────────────────────────────────────────
  # Job 3: 合并多架构 Manifest（amd64 + arm64 → :latest）
  # ──────────────────────────────────────────────────────────
  merge-manifests:
    name: 合并多架构 Manifest
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    permissions:
      contents: read

    steps:
      - name: 确定版本标签
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: 合并后端多架构 Manifest
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          IMG="${{ secrets.HARBOR_HOST }}/${{ secrets.HARBOR_PROJECT }}/traceiot-backend"
          if [ "$TAG" = "latest" ]; then
            docker buildx imagetools create --tag ${IMG}:latest \
              ${IMG}:latest-amd64 ${IMG}:latest-arm64
          else
            docker buildx imagetools create --tag ${IMG}:${TAG} --tag ${IMG}:latest \
              ${IMG}:${TAG}-amd64 ${IMG}:${TAG}-arm64
          fi

      - name: 合并前端多架构 Manifest
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          IMG="${{ secrets.HARBOR_HOST }}/${{ secrets.HARBOR_PROJECT }}/traceiot-frontend"
          if [ "$TAG" = "latest" ]; then
            docker buildx imagetools create --tag ${IMG}:latest \
              ${IMG}:latest-amd64 ${IMG}:latest-arm64
          else
            docker buildx imagetools create --tag ${IMG}:${TAG} --tag ${IMG}:latest \
              ${IMG}:${TAG}-amd64 ${IMG}:${TAG}-arm64
          fi
